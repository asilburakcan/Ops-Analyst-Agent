# Look and feel based on Cloudscape, AWS's open-source design system (Apache-2.0). Light theme only, like the AWS console.
[theme]
base = "light"
font = "Open Sans:https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap, sans-serif"
headingFont = "Open Sans:https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap, sans-serif"
baseFontSize = 15
baseRadius = "0.5rem"
showWidgetBorder = true
primaryColor = "#FF9900"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F3F3"
textColor = "#000716"
linkColor = "#0972D3"
borderColor = "#C6C6CD"
dataframeBorderColor = "#E9EBED"
dataframeHeaderBackgroundColor = "#F2F3F3"

[client]
toolbarMode = "minimal"  # no menu: one fixed light theme, nothing to switch

[browser]
gatherUsageStats = false
