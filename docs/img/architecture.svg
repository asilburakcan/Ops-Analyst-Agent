<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Ops Analyst Agent architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5F6B7A"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#EC7211"/></marker>
    <style>
      .box{fill:#FFFFFF;stroke:#C6C6CD;stroke-width:1.2}
      .aws{fill:#FFF7EC;stroke:#EC7211;stroke-width:1.4}
      .ext{fill:#F2F3F3;stroke:#8D99A8;stroke-width:1.2;stroke-dasharray:4 3}
      .t{font-size:15px;font-weight:700;fill:#000716}
      .s{font-size:12.5px;fill:#5F6B7A}
      .h{font-size:13px;font-weight:700;fill:#5F6B7A;letter-spacing:.06em}
      .l{stroke:#5F6B7A;stroke-width:1.6;fill:none}
      .lo{stroke:#EC7211;stroke-width:1.8;fill:none}
      .tag{font-size:12px;fill:#EC7211;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="600" rx="18" fill="#FFFFFF"/>

  <!-- section labels -->
  <text x="40" y="44" class="h">DATA AND INTELLIGENCE · daily scan on EC2, questions any time</text>
  <text x="40" y="364" class="h">OPERATIONS · how it runs and ships</text>
  <line x1="40" y1="335" x2="1160" y2="335" stroke="#E9EBED" stroke-width="1.5"/>

  <!-- row 1 -->
  <rect x="40" y="70" width="170" height="86" rx="12" class="ext"/>
  <text x="56" y="100" class="t">Open data</text>
  <text x="56" y="120" class="s">Amazon Last Mile</text>
  <text x="56" y="137" class="s">public S3 · 465 MB JSON</text>

  <rect x="250" y="70" width="170" height="86" rx="12" class="aws"/>
  <text x="266" y="100" class="t">S3 + Glue</text>
  <text x="266" y="120" class="s">3 Parquet tables</text>
  <text x="266" y="137" class="s">1.46 M packages</text>

  <rect x="460" y="70" width="170" height="86" rx="12" class="aws"/>
  <text x="476" y="100" class="t">Athena</text>
  <text x="476" y="120" class="s">SQL on S3</text>
  <text x="476" y="137" class="s">pay per query</text>

  <rect x="670" y="40" width="210" height="72" rx="12" class="box"/>
  <text x="686" y="68" class="t">Risk model</text>
  <text x="686" y="88" class="s">LightGBM · AUC 0.80</text>
  <text x="686" y="103" class="s">flags riskiest 1%</text>

  <rect x="670" y="124" width="210" height="72" rx="12" class="box"/>
  <text x="686" y="152" class="t">Analyst AI agent</text>
  <text x="686" y="172" class="s">finding · root cause</text>
  <text x="686" y="187" class="s">automation idea</text>

  <rect x="670" y="208" width="210" height="72" rx="12" class="box"/>
  <text x="686" y="236" class="t">SQL AI agent</text>
  <text x="686" y="256" class="s">question → Athena SQL</text>
  <text x="686" y="271" class="s">self-repair · 12/12 golden</text>

  <rect x="930" y="70" width="230" height="86" rx="12" class="aws"/>
  <text x="946" y="100" class="t">Results in S3</text>
  <text x="946" y="120" class="s">risk_flags · daily_reports</text>
  <text x="946" y="137" class="s">model_metrics · questions</text>

  <rect x="930" y="186" width="230" height="94" rx="12" class="box"/>
  <text x="946" y="214" class="t">Streamlit app</text>
  <text x="946" y="234" class="s">today's scan · ask the data</text>
  <text x="946" y="251" class="s">executive dashboard · EN/TR</text>
  <text x="946" y="268" class="s">read-only access · 50 questions/day</text>

  <path d="M210 113 H246" class="l" marker-end="url(#a)"/>
  <text x="212" y="134" class="s" font-size="11">ingest</text>
  <path d="M420 113 H456" class="l" marker-end="url(#a)"/>
  <path d="M630 100 H648 V76 H666" class="l" marker-end="url(#a)"/>
  <path d="M630 126 H648 V160 H666" class="l" marker-end="url(#a)"/>
  <path d="M666 244 H648 V140 H630" class="l" marker-end="url(#a)"/>
  <path d="M880 76 H905 V105 H926" class="l" marker-end="url(#a)"/>
  <path d="M880 160 H905 V122 H926" class="l" marker-end="url(#a)"/>
  <path d="M1045 156 V182" class="l" marker-end="url(#a)"/>
  <path d="M930 244 H884" class="l" marker-end="url(#a)"/>
  <text x="686" y="306" class="s">LLM: Groq (gpt-oss) · Bedrock with one setting</text>

  <!-- row 2 -->
  <rect x="40" y="392" width="200" height="86" rx="12" class="aws"/>
  <text x="56" y="422" class="t">EventBridge</text>
  <text x="56" y="442" class="s">Scheduler</text>
  <text x="56" y="459" class="s">starts EC2 at 04:55 UTC</text>

  <rect x="300" y="392" width="260" height="86" rx="12" class="aws"/>
  <text x="316" y="422" class="t">EC2 · t3.small</text>
  <text x="316" y="442" class="s">05:00 cron: risk model + analyst report</text>
  <text x="316" y="459" class="s">then stops itself · ~10 min/day</text>

  <rect x="620" y="392" width="160" height="86" rx="12" class="ext"/>
  <text x="636" y="422" class="t">GitHub</text>
  <text x="636" y="442" class="s">push to main</text>
  <text x="636" y="459" class="s">server code only</text>

  <rect x="840" y="392" width="320" height="86" rx="12" class="aws"/>
  <text x="856" y="422" class="t">CodePipeline</text>
  <text x="856" y="442" class="s">CodeBuild (compile + import check)</text>
  <text x="856" y="459" class="s">CodeDeploy → EC2</text>

  <path d="M240 435 H296" class="lo" marker-end="url(#o)"/>
  <path d="M780 435 H836" class="l" marker-end="url(#a)"/>
  <path d="M1000 478 V530 H430 V482" class="l" marker-end="url(#a)"/>
  <text x="620" y="550" class="s">deploy</text>

  <text x="40" y="580" class="s">IAM role on EC2, no access keys on the server · no open inbound port · read-only demo user · 1 GB Athena limit per query</text>
</svg>
